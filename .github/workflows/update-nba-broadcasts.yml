name: Update NBA broadcasts
on:
  workflow_dispatch:
  schedule:
    - cron: '15 11 * * *'
  push:
    paths:
      - '.github/workflows/update-nba-broadcasts.yml'
permissions:
  contents: write
concurrency:
  group: nba-broadcast-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/collect-nba-broadcasts.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nba-broadcasts.json
          git diff --cached --quiet || (git commit -m "Refresh NBA broadcast data" && git pull --rebase && git push)
